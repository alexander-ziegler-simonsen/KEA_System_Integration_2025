<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Browser SDP</title>
  </head>
  <body>
    <div id="videos">
      <video id="localVideo" autoplay playsinline></video>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <button id="createOfferButton">Create Offer</button>
    <label>SDP Offer (step 1 - client 1)</label></br>
    <label>past Offer in here (step 2 - client 2)</label>
    <textarea id="sdpOfferTextArea"></textarea>

    <button id="createAnswerButton">Create Answer</button>
    <label>SDP Answer (step 3 - client 2) (copy to client 1)</label>
    <textarea id="sdpAnswerTextArea"></textarea>

    <button id="addAnswerButton">Add Answer</button> 
    <label>past Answer (from client 2) in box above and click the button (step 4 - client 1)</label>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
